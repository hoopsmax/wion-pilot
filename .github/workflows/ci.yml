name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes, so the token doesn't need to stay in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # A broken web app build should fail here, not later in the E2E suite.
      - run: npm run build --workspaces --if-present

  e2e:
    name: E2E tests
    # No point in starting browsers when lint, types or unit tests already fail.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser that matches our Playwright version, with its system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the HTML report
        # Also (and especially) when tests fail: it holds the screenshots, videos and traces.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Keep the bug-report drafts
        # Drafts are written only for failing tests, so this step runs only then.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: bug-report-drafts
          path: reports/bugs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show what failed in the log
        # The log can be read at once, also where downloading artifacts is not possible: each
        # draft (steps, console errors, failed requests) and what the page showed. The test
        # server's throwaway session tokens are hidden all the same.
        if: ${{ failure() }}
        run: |
          for file in reports/bugs/*.md test-results/*/error-context.md; do
            [ -f "$file" ] || continue
            echo "::group::$file"
            sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1<hidden>/g' "$file"
            echo "::endgroup::"
          done
      - name: Put the GitHub Pages site together
        # The landing page at the root, the demo GIF next to it, and the report under report/.
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p _site
          cp site/index.html docs/media/wion-demo.gif _site/
          cp -r playwright-report _site/report
      - name: Prepare the site for GitHub Pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  bug-report-demo:
    name: Bug-report demo
    # Proves on every push that a deliberately failing test produces a complete draft (M3).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the scenario that fails on purpose
        run: |
          if npm run demo:bug; then
            echo "The @demo-bug scenario passed, but it must fail."
            exit 1
          fi
      - name: Check that the draft is complete
        run: |
          draft=reports/bugs/demo-bug--a-deliberately-wrong-expectation.md
          test -f "$draft" || { echo "No draft was written: $draft"; exit 1; }
          for text in 'DRAFT: verify before filing' '(fails here)' '(not run)' \
            '"Welcome back!"' 'Email or password is wrong.' '[Screenshot](' '[Trace](' \
            'POST /api/session → 401'; do
            grep -qF "$text" "$draft" || { echo "Missing in the draft: $text"; exit 1; }
          done
          echo "The draft is complete."
      - name: Keep the demo draft
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bug-report-demo
          path: reports/bugs/
          retention-days: 14

  app-map:
    name: App map
    # Runs the README's commands on every push and keeps the map of Sprout to look at (M4).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @wion-pilot/sprout
      - name: Start Sprout on a throwaway copy of the seed data
        run: |
          SPROUT_DATA_FILE="$RUNNER_TEMP/sprout-db.json" node apps/sprout/src/server/main.ts &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4600 && exit 0
            sleep 1
          done
          echo "Sprout did not start within 30 seconds."
          exit 1
      - run: npm run map:sprout
      - name: Keep the map
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-map
          path: .wion/map/
          # The folder .wion starts with a dot; upload-artifact skips such paths unless told not to.
          include-hidden-files: true
          retention-days: 14

  publish-report:
    name: Publish the report
    # Only main is published, and also after failing tests: the page always shows the latest run.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: e2e
    runs-on: ubuntu-latest
    # The only job allowed to publish; every other job keeps read-only permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
