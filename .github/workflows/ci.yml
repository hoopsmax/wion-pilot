name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes, so the token doesn't need to stay in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # A broken web app build should fail here, not later in the E2E suite.
      - run: npm run build --workspaces --if-present

  e2e:
    name: E2E tests
    # No point in starting browsers when lint, types or unit tests already fail.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser that matches our Playwright version, with its system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the HTML report
        # Also (and especially) when tests fail: it holds the screenshots, videos and traces.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Prepare the report for GitHub Pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  publish-report:
    name: Publish the report
    # Only main is published, and also after failing tests: the page always shows the latest run.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: e2e
    runs-on: ubuntu-latest
    # The only job allowed to publish; every other job keeps read-only permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
